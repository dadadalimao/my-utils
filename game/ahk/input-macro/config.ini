; input-macro 配置（UTF-8）
; 每一段 [macro_xxx] 是一路独立宏，toggle_hotkey 同一键启动/停止。
; 多路可同时开。改完后托盘右键「重载配置」。
;
; device: mouse | keyboard
; mode:   click（连点）| hold（按住）
; 热键与目标键可以相同，例如 toggle_hotkey=F 且 keyboard_key=F。
; 热键写法：F8、^F8（Ctrl+F8）、!F8（Alt）、+F8（Shift）、XButton1（鼠标侧键）

[general]
; 暂停/恢复全部宏热键（暂停时松开长按，F/W/侧键还原，方便打字；再按一次恢复）
; NumpadSub = 小键盘减号
suspend_hotkey=NumpadSub
; 游戏里优先 Event；桌面可用 Input
send_mode=Event

; 靠后的拇指侧键开/关左键连点；另一个侧键是 XButton2
[macro_left_click]
enabled=1
toggle_hotkey=XButton1
device=mouse
mode=click
mouse_button=left
interval_ms=50

; [macro_right_hold]
; enabled=1
; toggle_hotkey=F9
; device=mouse
; mode=hold
; mouse_button=right

; [macro_space_click]
; enabled=1
; toggle_hotkey=F10
; device=keyboard
; mode=click
; keyboard_key=Space
; interval_ms=80

; 点一下 W 开始按住（前进），再点一下松开
[macro_w_hold]
enabled=1
toggle_hotkey=W
device=keyboard
mode=hold
keyboard_key=W

; 热键=目标键：点一下 F 开始按住，再点一下松开（会占用字母 F，打字时请关掉）
[macro_f_hold]
enabled=1
toggle_hotkey=F
device=keyboard
mode=hold
keyboard_key=F
