<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node 脚本工具集</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
        }

        .main-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        .page-title {
            margin: 0 0 8px;
        }

        .page-desc {
            color: #666;
            margin: 0 0 28px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .tool-icon {
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            background-color: #eef2f7;
        }

        .tool-content {
            padding: 18px;
        }

        .tool-title {
            font-size: 1.15rem;
            margin: 0 0 8px;
        }

        .tool-description {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        .hint {
            margin-top: 32px;
            padding: 14px 16px;
            background: #fff8e6;
            border: 1px solid #ffe08a;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #6b5700;
        }

        code {
            background: #f1f3f5;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="main-content">
        <h1 class="page-title">Node 脚本工具集</h1>
        <p class="page-desc">依赖 Node 本地服务的脚本工具，请先启动服务后使用带界面的功能。</p>

        <div class="tool-grid">
            <a href="tools/gif-to-lottie/index.html" class="tool-card">
                <div class="tool-icon">🎬</div>
                <div class="tool-content">
                    <h2 class="tool-title">GIF 转 Lottie</h2>
                    <p class="tool-description">上传 GIF，生成图像序列型 Lottie JSON，支持预览与下载</p>
                </div>
            </a>
            <a href="tools/gif-crop/index.html" class="tool-card">
                <div class="tool-icon">✂️</div>
                <div class="tool-content">
                    <h2 class="tool-title">GIF 裁剪</h2>
                    <p class="tool-description">上传 GIF，输入或拖拽调整裁剪范围，导出新的 GIF</p>
                </div>
            </a>
        </div>

        <div class="hint">
            启动服务：在 <code>nodeScript</code> 目录执行 <code>npm install</code> 后运行 <code>npm start</code>，
            浏览器访问 <code>http://localhost:3920</code>
        </div>
    </div>
</body>

</html>
